<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awesomesprout Tutor Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        /* Prevent layout shift from scrollbar */
        html { overflow-y: scroll; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        awesomedark: '#072A1C',
                        awesomemedium: '#0B6E3F',
                        awesomeorange: '#F26513'
                    }
                }
            }
        }
    </script>
</head>
<body class="text-gray-800 antialiased h-screen flex flex-col">

    <!-- Toast Notifications -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- AUTHENTICATION SCREEN -->
    <div id="auth-screen" class="flex-1 flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full border border-gray-100">
            <div class="flex justify-center mb-6">
                <img src="AWESOMESPROUT logo_2.png" alt="Awesomesprout Logo" class="h-16 object-contain" onerror="this.src='https://placehold.co/400x150/0B6E3F/white?text=AWESOMESPROUT'">
            </div>
            <h2 class="text-2xl font-bold text-center text-awesomedark mb-2">Welcome Back</h2>
            <p class="text-center text-gray-500 mb-8">Please enter your details to continue.</p>
            
            <form id="auth-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                    <input type="text" id="tutor-name" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-awesomemedium focus:border-awesomemedium transition-colors outline-none" placeholder="e.g. Jane Doe">
                </div>
                
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="is-admin" class="w-4 h-4 text-awesomemedium focus:ring-awesomemedium border-gray-300 rounded cursor-pointer">
                    <label for="is-admin" class="text-sm text-gray-600 cursor-pointer">Log in as Administrator</label>
                </div>

                <div id="admin-pin-container" class="hidden">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Admin PIN</label>
                    <input type="password" id="admin-pin" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-awesomemedium focus:border-awesomemedium transition-colors outline-none" placeholder="Enter PIN">
                </div>

                <button type="submit" class="w-full bg-awesomeorange hover:bg-orange-600 text-white font-semibold py-3 px-4 rounded-lg shadow-md transition-colors duration-200">
                    Enter Portal
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN APP SCREEN -->
    <div id="app-screen" class="hidden flex-1 flex flex-col h-full overflow-hidden">
        <!-- Header -->
        <header class="bg-white border-b border-gray-200 sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center h-16">
                    <div class="flex items-center gap-3">
                        <img src="AWESOMESPROUT logo.png" alt="Logo" class="h-8 object-contain" onerror="this.src='https://placehold.co/100x100/0B6E3F/white?text=A'">
                        <span class="font-bold text-awesomedark text-lg hidden sm:block">Portal</span>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="flex items-center gap-2 bg-gray-50 px-3 py-1.5 rounded-full border border-gray-100">
                            <div id="user-avatar" class="w-7 h-7 rounded-full bg-awesomemedium text-white flex items-center justify-center text-sm font-bold">
                                U
                            </div>
                            <span id="user-name-display" class="text-sm font-medium text-gray-700">User</span>
                            <span id="role-badge" class="hidden ml-1 px-2 py-0.5 text-[10px] uppercase font-bold tracking-wider bg-awesomeorange text-white rounded-full">Admin</span>
                        </div>
                        <button id="btn-signout" class="text-gray-500 hover:text-red-500 transition-colors text-sm font-medium">
                            Sign Out
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content Scrollable Area -->
        <div class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
            <div class="max-w-7xl mx-auto">
                
                <!-- TUTOR DASHBOARD -->
                <div id="tutor-view" class="hidden space-y-6">
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        
                        <!-- Log Form -->
                        <div class="lg:col-span-1">
                            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 sticky top-6">
                                <h2 class="text-lg font-bold text-gray-900 mb-4 border-b pb-2">Log New Class</h2>
                                <form id="log-class-form" class="space-y-4">
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">Student Name</label>
                                        <input type="text" id="student-name" required class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-awesomemedium outline-none" placeholder="Student's full name">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">Date</label>
                                        <input type="date" id="class-date" required class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-awesomemedium outline-none">
                                    </div>
                                    <div class="grid grid-cols-2 gap-4">
                                        <div>
                                            <label class="block text-sm font-medium text-gray-700 mb-1">Start Time</label>
                                            <input type="time" id="start-time" required class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-awesomemedium outline-none">
                                        </div>
                                        <div>
                                            <label class="block text-sm font-medium text-gray-700 mb-1">End Time</label>
                                            <input type="time" id="end-time" required class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-awesomemedium outline-none">
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">Attendance Status</label>
                                        <select id="attendance-status" required class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-awesomemedium outline-none">
                                            <option value="Attended">Attended</option>
                                            <option value="Missed">Missed (Excused/Unexcused)</option>
                                        </select>
                                    </div>
                                    <button type="submit" id="btn-log-class" class="w-full bg-awesomemedium hover:bg-[#08522f] text-white font-semibold py-2.5 rounded-lg shadow-sm transition-colors mt-2">
                                        Submit Log
                                    </button>
                                </form>
                            </div>
                        </div>

                        <!-- Tutor History & Chart -->
                        <div class="lg:col-span-2 space-y-6">
                            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                                <h2 class="text-lg font-bold text-gray-900 mb-4">My Weekly Overview</h2>
                                <div class="h-48 w-full">
                                    <canvas id="tutor-chart"></canvas>
                                </div>
                            </div>

                            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                                <div class="px-6 py-4 border-b border-gray-100">
                                    <h2 class="text-lg font-bold text-gray-900">My Class History</h2>
                                </div>
                                <div class="overflow-x-auto">
                                    <table class="min-w-full divide-y divide-gray-200">
                                        <thead class="bg-gray-50">
                                            <tr>
                                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Student</th>
                                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Time</th>
                                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                                            </tr>
                                        </thead>
                                        <tbody id="tutor-table-body" class="bg-white divide-y divide-gray-200">
                                            <!-- Tutor logs injected here -->
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ADMIN DASHBOARD -->
                <div id="admin-view" class="hidden space-y-8">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
                        <div>
                            <h1 class="text-2xl font-bold text-gray-900">Master Dashboard</h1>
                            <p class="text-gray-500 text-sm">Company-wide attendance overview (Cloud Synced).</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <select id="admin-chart-filter" class="px-4 py-2 border border-gray-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-awesomemedium bg-white">
                                <option value="monthly">Monthly Overview</option>
                                <option value="tutor">Tutor Overview</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                        <div class="h-64 w-full">
                            <canvas id="admin-chart"></canvas>
                        </div>
                    </div>

                    <!-- Admin Filters & Table -->
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                        <div class="p-6 border-b border-gray-100 bg-gray-50">
                            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                                <div>
                                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Filter Tutor</label>
                                    <select id="filter-tutor" class="w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-awesomemedium outline-none"></select>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Filter Month</label>
                                    <select id="filter-month" class="w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-awesomemedium outline-none"></select>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Filter Student</label>
                                    <select id="filter-student" class="w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-awesomemedium outline-none"></select>
                                </div>
                                <div class="flex items-end">
                                    <button id="btn-clear-filters" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-2 rounded-lg transition-colors text-sm">
                                        Clear Filters
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="min-w-full divide-y divide-gray-200">
                                <thead class="bg-gray-50">
                                    <tr>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Tutor Name</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Student Name</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Time</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                                    </tr>
                                </thead>
                                <tbody id="admin-table-body" class="bg-white divide-y divide-gray-200">
                                    <!-- Admin logs injected here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Application Logic -->
    <script type="module">
        // Import Firebase SDKs (Browser compatible)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Your exact Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCodpr8zsxSw_t7XD8OGePyYzhtblqqXVY",
            authDomain: "awesomesprout-portal.firebaseapp.com",
            projectId: "awesomesprout-portal",
            storageBucket: "awesomesprout-portal.firebasestorage.app",
            messagingSenderId: "570100697052",
            appId: "1:570100697052:web:9799a5a343731ec99d7119",
            measurementId: "G-MTSNQZ8XMM"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Chart.js Default Styles
        if(window.Chart) {
            Chart.defaults.font.family = "'Inter', sans-serif";
            Chart.defaults.color = '#64748b';
        }

        // State
        let currentUser = null;
        let allCompanyLogs = [];
        let tutorChartInst = null;
        let adminChartInst = null;
        let unsubscribeLogs = null;

        // DOM Elements
        const views = {
            auth: document.getElementById('auth-screen'),
            app: document.getElementById('app-screen'),
            tutor: document.getElementById('tutor-view'),
            admin: document.getElementById('admin-view')
        };

        // Auth UI
        const authForm = document.getElementById('auth-form');
        const tutorNameInput = document.getElementById('tutor-name');
        const isAdminCheckbox = document.getElementById('is-admin');
        const adminPinContainer = document.getElementById('admin-pin-container');
        const adminPinInput = document.getElementById('admin-pin');

        // App UI
        const displayUserName = document.getElementById('user-name-display');
        const userAvatar = document.getElementById('user-avatar');
        const roleBadge = document.getElementById('role-badge');

        // Tutor UI
        const logClassForm = document.getElementById('log-class-form');
        const classDateInput = document.getElementById('class-date');
        const tutorTableBody = document.getElementById('tutor-table-body');

        // Admin UI
        const adminTableBody = document.getElementById('admin-table-body');
        const adminChartFilter = document.getElementById('admin-chart-filter');
        const filterTutor = document.getElementById('filter-tutor');
        const filterMonth = document.getElementById('filter-month');
        const filterStudent = document.getElementById('filter-student');
        const btnClearFilters = document.getElementById('btn-clear-filters');

        // Toast functionality
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-awesomemedium' : 'bg-red-500';
            toast.className = `${bgColor} text-white px-6 py-3 rounded-lg shadow-lg flex items-center gap-3 transform translate-x-full transition-transform duration-300`;
            
            toast.innerHTML = `
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    ${type === 'success' ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>' : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>'}
                </svg>
                <span class="font-medium">${message}</span>
            `;
            
            container.appendChild(toast);
            
            requestAnimationFrame(() => {
                toast.classList.remove('translate-x-full');
            });

            setTimeout(() => {
                toast.classList.add('translate-x-full');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Toggle Admin PIN field
        isAdminCheckbox?.addEventListener('change', (e) => {
            if (e.target.checked) {
                adminPinContainer.classList.remove('hidden');
                adminPinInput.required = true;
            } else {
                adminPinContainer.classList.add('hidden');
                adminPinInput.required = false;
            }
        });

        // Navigation
        function switchScreen(screen) {
            Object.values(views).forEach(v => {
                if(v) v.classList.add('hidden');
            });
            if(screen === 'auth' && views.auth) views.auth.classList.remove('hidden');
            if(screen === 'app' && views.app) views.app.classList.remove('hidden');
        }

        // Auth Submission
        authForm?.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = tutorNameInput.value.trim();
            const isAdmin = isAdminCheckbox.checked;
            
            if (isAdmin && adminPinInput.value !== '1234') {
                showToast("Invalid Admin PIN. Please input the correct PIN.", "error");
                return;
            }

            currentUser = {
                name: name,
                role: isAdmin ? 'admin' : 'tutor'
            };

            // Save identity locally so they don't have to login every time
            localStorage.setItem('awesomesprout_user', JSON.stringify(currentUser));
            setupApplication();
        });

        // Setup Application
        function initialize() {
            const storedUser = localStorage.getItem('awesomesprout_user');
            if (storedUser) {
                currentUser = JSON.parse(storedUser);
                setupApplication();
            } else {
                switchScreen('auth');
            }
        }

        function setupApplication() {
            if (displayUserName) displayUserName.textContent = currentUser.name;
            if (userAvatar) userAvatar.textContent = currentUser.name.charAt(0).toUpperCase();
            
            if(classDateInput) {
                classDateInput.value = new Date().toISOString().split('T')[0];
            }
            
            switchScreen('app');
            
            if (currentUser.role === 'admin') {
                if(views.admin) views.admin.classList.remove('hidden');
                if(views.tutor) views.tutor.classList.add('hidden');
                if(roleBadge) roleBadge.classList.remove('hidden');
            } else {
                if(views.admin) views.admin.classList.add('hidden');
                if(views.tutor) views.tutor.classList.remove('hidden');
                if(roleBadge) roleBadge.classList.add('hidden');
            }

            // Connect to real-time database
            loadAllLogsRealtime();
        }

        // Connect to Firestore Real-Time Database
        function loadAllLogsRealtime() {
            const logsRef = collection(db, 'class_logs');
            const q = query(logsRef, orderBy('createdAt', 'desc'));
            
            // onSnapshot automatically listens for any new data globally!
            unsubscribeLogs = onSnapshot(q, (snapshot) => {
                allCompanyLogs = [];
                snapshot.forEach((doc) => {
                    allCompanyLogs.push({ id: doc.id, ...doc.data() });
                });
                
                // Sort by date and time descending
                allCompanyLogs.sort((a, b) => new Date(`${b.date}T${b.startTime}`) - new Date(`${a.date}T${a.startTime}`));

                if (currentUser.role === 'admin') {
                    populateFilters();
                    renderAdminView();
                } else {
                    renderTutorView();
                }
            }, (error) => {
                console.error("Error fetching logs:", error);
                showToast("Cannot connect to database. Check Firebase config.", "error");
            });
        }

        // Tutor Actions
        logClassForm?.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;
            
            const submitBtn = document.getElementById('btn-log-class');
            const originalContent = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = 'Saving to Cloud...';
            
            const newLog = {
                tutorName: currentUser.name,
                studentName: document.getElementById('student-name').value,
                date: classDateInput.value,
                startTime: document.getElementById('start-time').value,
                endTime: document.getElementById('end-time').value,
                attendance: document.getElementById('attendance-status').value,
                createdAt: new Date().toISOString()
            };

            try {
                // Save to Firestore Database
                await addDoc(collection(db, 'class_logs'), newLog);
                showToast("Log submitted to the master dashboard!");
                document.getElementById('student-name').value = '';
            } catch (error) {
                console.error("Error adding document: ", error);
                showToast("Failed to save. Check your connection.", "error");
            }
            
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalContent;
        });

        function renderTutorView() {
            if (!tutorTableBody) return;
            const myLogs = allCompanyLogs.filter(log => log.tutorName === currentUser.name);
            
            tutorTableBody.innerHTML = '';
            if (myLogs.length === 0) {
                tutorTableBody.innerHTML = `<tr><td colspan="5" class="px-6 py-4 text-center text-gray-500">No classes logged yet.</td></tr>`;
            } else {
                myLogs.forEach(log => {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-gray-50 transition-colors";
                    
                    const statusColor = log.attendance === 'Attended' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800';
                    
                    tr.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${log.studentName}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${log.date}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${log.startTime} - ${log.endTime}</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="px-2.5 py-1 inline-flex text-xs leading-5 font-semibold rounded-full ${statusColor}">
                                ${log.attendance}
                            </span>
                        </td>
                    `;
                    tutorTableBody.appendChild(tr);
                });
            }

            renderTutorChart(myLogs);
        }

        function renderTutorChart(logs) {
            const chartCanvas = document.getElementById('tutor-chart');
            if (!chartCanvas || !window.Chart) return;
            const ctx = chartCanvas.getContext('2d');
            
            const last7Days = [...Array(7)].map((_, i) => {
                const d = new Date();
                d.setDate(d.getDate() - i);
                return d.toISOString().split('T')[0];
            }).reverse();

            const attendedData = last7Days.map(date => 
                logs.filter(l => l.date === date && l.attendance === 'Attended').length
            );
            const missedData = last7Days.map(date => 
                logs.filter(l => l.date === date && l.attendance === 'Missed').length
            );

            if (tutorChartInst) tutorChartInst.destroy();
            
            tutorChartInst = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: last7Days,
                    datasets: [
                        { label: 'Attended', data: attendedData, backgroundColor: '#0B6E3F', borderRadius: 4 },
                        { label: 'Missed', data: missedData, backgroundColor: '#ef4444', borderRadius: 4 }
                    ]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false, 
                    scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } 
                }
            });
        }

        // Admin Logic
        function populateFilters() {
            if (!filterTutor || !filterMonth || !filterStudent) return;

            const tutors = [...new Set(allCompanyLogs.map(l => l.tutorName))].sort();
            const students = [...new Set(allCompanyLogs.map(l => l.studentName))].sort();
            const months = [...new Set(allCompanyLogs.map(l => l.date.substring(0,7)))].sort().reverse();
            
            const currentTutor = filterTutor.value;
            const currentMonth = filterMonth.value;
            const currentStudent = filterStudent.value;

            filterTutor.innerHTML = '<option value="">All Tutors</option>';
            tutors.forEach(t => filterTutor.innerHTML += `<option value="${t}">${t}</option>`);
            
            filterMonth.innerHTML = '<option value="">All Months</option>';
            months.forEach(m => {
                const display = new Date(m + '-01').toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
                filterMonth.innerHTML += `<option value="${m}">${display}</option>`;
            });
            
            filterStudent.innerHTML = '<option value="">All Students</option>';
            students.forEach(s => filterStudent.innerHTML += `<option value="${s}">${s}</option>`);

            filterTutor.value = currentTutor;
            filterMonth.value = currentMonth;
            filterStudent.value = currentStudent;
        }

        function renderAdminView() {
            if (!adminTableBody) return;
            let filteredLogs = allCompanyLogs;
            
            if (filterTutor && filterTutor.value) filteredLogs = filteredLogs.filter(l => l.tutorName === filterTutor.value);
            if (filterMonth && filterMonth.value) filteredLogs = filteredLogs.filter(l => l.date.startsWith(filterMonth.value));
            if (filterStudent && filterStudent.value) filteredLogs = filteredLogs.filter(l => l.studentName === filterStudent.value);

            adminTableBody.innerHTML = '';
            if (filteredLogs.length === 0) {
                adminTableBody.innerHTML = `<tr><td colspan="5" class="px-6 py-4 text-center text-gray-500">No logs match the selected filters.</td></tr>`;
            } else {
                filteredLogs.forEach(log => {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-gray-50 transition-colors";
                    const statusColor = log.attendance === 'Attended' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800';
                    
                    tr.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${log.tutorName}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${log.studentName}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${log.date}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${log.startTime} - ${log.endTime}</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="px-2.5 py-1 inline-flex text-xs leading-5 font-semibold rounded-full ${statusColor}">
                                ${log.attendance}
                            </span>
                        </td>
                    `;
                    adminTableBody.appendChild(tr);
                });
            }
            
            renderAdminChart(filteredLogs);
        }

        function renderAdminChart(logs) {
            const chartCanvas = document.getElementById('admin-chart');
            if (!chartCanvas || !window.Chart) return;
            
            const ctx = chartCanvas.getContext('2d');
            const viewType = adminChartFilter ? adminChartFilter.value : 'monthly';

            let labels = [];
            let attendedData = [];
            let missedData = [];

            if (viewType === 'monthly') {
                const countsByMonth = {};
                logs.forEach(l => {
                    const month = l.date.substring(0, 7);
                    if (!countsByMonth[month]) countsByMonth[month] = { attended: 0, missed: 0 };
                    if (l.attendance === 'Attended') countsByMonth[month].attended++;
                    else countsByMonth[month].missed++;
                });
                labels = Object.keys(countsByMonth).sort();
                attendedData = labels.map(m => countsByMonth[m].attended);
                missedData = labels.map(m => countsByMonth[m].missed);
                labels = labels.map(m => new Date(m + '-01').toLocaleDateString(undefined, { month: 'short', year: 'numeric' }));
            } else {
                const countsByTutor = {};
                logs.forEach(l => {
                    const t = l.tutorName;
                    if (!countsByTutor[t]) countsByTutor[t] = { attended: 0, missed: 0 };
                    if (l.attendance === 'Attended') countsByTutor[t].attended++;
                    else countsByTutor[t].missed++;
                });
                labels = Object.keys(countsByTutor).sort();
                attendedData = labels.map(t => countsByTutor[t].attended);
                missedData = labels.map(t => countsByTutor[t].missed);
            }

            if (adminChartInst) adminChartInst.destroy();
            
            adminChartInst = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels.length ? labels : ['No Data'],
                    datasets: [
                        { label: 'Attended', data: labels.length ? attendedData : [0], backgroundColor: '#0B6E3F', borderRadius: 4 },
                        { label: 'Missed', data: labels.length ? missedData : [0], backgroundColor: '#ef4444', borderRadius: 4 }
                    ]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false, 
                    scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } 
                }
            });
        }

        // Filter event listeners
        [filterTutor, filterMonth, filterStudent, adminChartFilter].forEach(el => {
            if(el) el.addEventListener('change', renderAdminView);
        });

        btnClearFilters?.addEventListener('click', () => {
            if(filterTutor) filterTutor.value = '';
            if(filterMonth) filterMonth.value = '';
            if(filterStudent) filterStudent.value = '';
            renderAdminView();
        });

        // Sign out
        document.getElementById('btn-signout')?.addEventListener('click', () => {
            if (unsubscribeLogs) unsubscribeLogs(); // Stop listening to db
            localStorage.removeItem('awesomesprout_user');
            currentUser = null;
            allCompanyLogs = [];
            switchScreen('auth');
            if(tutorNameInput) tutorNameInput.value = '';
            if(isAdminCheckbox) isAdminCheckbox.checked = false;
            if(adminPinContainer) adminPinContainer.classList.add('hidden');
        });

        // Start App
        window.addEventListener('DOMContentLoaded', initialize);
    </script>
</body>
</html>
